<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservación | Port Island</title>
    <link rel="stylesheet" href="/css/reserva.css">
</head>
<body>
    
    <header class="header">
        <h1 class="title">Reservación</h1>
        <a href="/index.html" class="back-btn">Volver</a>
    </header>

    <section class="form-section">
        <form class="reservation-form" action="#" method="post">

            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 987654321" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="Ej: ejemplo@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de reservación:</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="form-group">
                <label for="hora">Hora de reservación:</label>
                <input type="time" id="hora" name="hora" required>
            </div>

            <div class="form-group">
                <label for="personas">Número de personas:</label>
                <input type="number" id="personas" name="personas" min="1" max="20" placeholder="Ej: 4" required>
            </div>

            <div class="form-group">
                <label for="mesa">Mesa:</label>
                <input type="number" id="mesa" name="mesa" min="1" max="11" required>
            </div>
        </form>

        <div class="logo-container">
            <img src="/images/logo.png" alt="Logo del restaurante">
        </div>

        <div class="buttons">
            <button type="submit" form="formulario">Reservar</button>
            <a href="index.html" class="cancel-btn">Cancelar</a>
        </div>
    </section>

    <footer>
        © 2025 Port Island · Todos los derechos reservados ·
    </footer>
</body>
</html>
